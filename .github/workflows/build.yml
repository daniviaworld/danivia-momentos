name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configuración de Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_OK=1" >> "$GITHUB_ENV"
          else
            cp ci/google-services.placeholder.json app/google-services.json
            echo "::warning::Falta el secreto GOOGLE_SERVICES_JSON. El APK compila pero no se conectará a Firebase."
          fi

      - name: Firma del APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/momentos.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_OK=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos de firma. Se usa una firma temporal (no sirve para actualizar la app instalada)."
          fi

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PupdateRepo=${{ github.repository }} --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk DaniviaMomentos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DaniviaMomentos-${{ github.run_number }}
          path: DaniviaMomentos.apk

      - name: Publicar versión descargable
        if: env.FIREBASE_OK == '1' && env.SIGN_OK == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DANIVIA Momentos 1.0.${{ github.run_number }}
          body: "Descarga DaniviaMomentos.apk e instálalo en el móvil o en la Android TV."
          files: DaniviaMomentos.apk
          make_latest: true
